# Checks merge requests for breaking API changes against the target branch,
# and shows the findings in the merge request's Code Quality widget.
#
# Expects a faultline.toml at the repository root listing the APIs:
#
#   [[api]]
#   name = "public"
#   entry = "api/openapi.yaml"
# The job installs a release into a stock image. The published image
# (ghcr.io/integral0909/faultline:X.Y.Z, with `entrypoint: [""]` in the job's
# `image`) spares the download.
api-compatibility:
  image: debian:stable-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["api/**/*", "faultline.toml"]
  variables:
    # The merge request's base commit must be in the clone.
    GIT_DEPTH: 0
    # Pin the release to install.
    FAULTLINE_VERSION: "X.Y.Z"
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git ca-certificates > /dev/null
    - name="faultline-${FAULTLINE_VERSION}-x86_64-unknown-linux-musl"
    - base="https://github.com/integral0909/faultline/releases/download/v${FAULTLINE_VERSION}"
    - curl -fsSLO "$base/$name.tar.gz" -O "$base/SHA256SUMS"
    - grep " $name.tar.gz\$" SHA256SUMS | sha256sum -c -
    - tar xzf "$name.tar.gz" && mv "$name/faultline" /usr/local/bin/
  script:
    # --base defaults to $CI_MERGE_REQUEST_DIFF_BASE_SHA. The Code Quality
    # report is written even when the check fails.
    - faultline check --report gitlab=gl-code-quality-report.json
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
