# Checks pull requests for breaking API changes against the target branch.
name: API compatibility

on:
  pull_request:
    paths: ["api/**"]

permissions:
  contents: read
  # Needed to upload SARIF results to code scanning.
  security-events: write

jobs:
  faultline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the base version
        run: git worktree add ../base "origin/${{ github.base_ref }}"
      - name: Install faultline
        run: cargo install --locked --git https://github.com/integral0909/faultline faultline-cli
      - name: Compare
        run: |
          mkdir -p old
          cp -r ../base/api old/
          faultline diff old/api/openapi.yaml api/openapi.yaml --output github
      - name: SARIF report
        if: always()
        run: faultline diff old/api/openapi.yaml api/openapi.yaml --output sarif --fail-on never > faultline.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: faultline.sarif
