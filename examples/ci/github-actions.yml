# Checks pull requests for breaking API changes against the target branch.
#
# Expects a faultline.toml at the repository root listing the APIs:
#
#   [[api]]
#   name = "public"
#   entry = "api/openapi.yaml"
name: API compatibility

on:
  pull_request:
    paths: ["api/**", "faultline.toml"]

permissions:
  contents: read
  # Needed to upload SARIF results to code scanning.
  security-events: write

jobs:
  faultline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base with the target branch must be in the clone.
          fetch-depth: 0
      - name: Install faultline
        run: cargo install --locked --git https://github.com/integral0909/faultline faultline-cli
      - name: Check
        # --base defaults to origin/$GITHUB_BASE_REF in pull request builds.
        run: faultline check --output github
      - name: SARIF report
        if: always()
        run: faultline check --output sarif --fail-on never > faultline.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: faultline.sarif
