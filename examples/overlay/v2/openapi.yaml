openapi: 3.1.0
info:
  title: Pet Store
  version: 1.1.0
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: limit
          in: query
          schema: {type: integer, maximum: 100}
        - name: cursor
          in: query
          schema: {type: string}
      responses:
        "200":
          description: The pets.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Pet"}
  /internal/reindex:
    post:
      operationId: reindex
      x-internal: true
      parameters:
        - {name: shard, in: query, required: true, schema: {type: integer}}
      responses:
        "204": {description: Reindexed.}
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
