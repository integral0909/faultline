asyncapi: 3.0.0
info:
  title: Orders
  version: 2.0.0
  description: Order events on Kafka, with Protobuf payloads.
channels:
  orderPlaced:
    address: shop.orders.placed
    messages:
      OrderPlaced:
        contentType: application/protobuf
        payload:
          schemaFormat: application/vnd.google.protobuf;version=3
          schema: |
            syntax = "proto3";
            package shop;
            import "money.proto";

            message OrderPlaced {
              string id = 1;
              reserved 2;
              Money total = 3;
              repeated Line lines = 4;
              string coupon = 5;
            }

            message Line {
              uint64 sku = 1;
              int64 quantity = 2;
            }
operations:
  publishOrderPlaced:
    action: send
    channel:
      $ref: '#/channels/orderPlaced'
