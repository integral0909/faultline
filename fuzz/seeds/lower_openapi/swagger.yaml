swagger: "2.0"
info:
  title: Pet Store
  version: 1.0.0
host: pets.example.com
basePath: /
schemes: [https]
consumes: [application/json]
produces: [application/json]
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: limit
          in: query
          type: integer
          format: int32
          maximum: 100
      responses:
        "200":
          description: A page of pets.
          schema:
            type: array
            items:
              $ref: "#/definitions/Pet"
    post:
      operationId: createPet
      parameters:
        - name: pet
          in: body
          required: true
          schema:
            $ref: "#/definitions/NewPet"
      responses:
        "201":
          description: Created.
          schema:
            $ref: "#/definitions/Pet"
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        type: string
    get:
      operationId: getPet
      responses:
        "200":
          description: The pet.
          schema:
            $ref: "#/definitions/Pet"
    delete:
      operationId: deletePet
      responses:
        "204":
          description: Deleted.
definitions:
  NewPet:
    type: object
    required: [name]
    properties:
      name:
        type: string
        maxLength: 64
      tag:
        type: string
  Pet:
    allOf:
      - $ref: "#/definitions/NewPet"
      - type: object
        required: [id, status]
        properties:
          id:
            type: integer
            format: int64
            readOnly: true
          status:
            type: string
            enum: [available, pending, sold]
