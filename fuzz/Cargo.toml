[package]
name = "faultline-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
faultline-doc = { path = "../crates/faultline-doc" }
faultline-source = { path = "../crates/faultline-source" }
faultline-ir = { path = "../crates/faultline-ir" }
faultline-jsonschema = { path = "../crates/faultline-jsonschema" }
faultline-openapi = { path = "../crates/faultline-openapi" }
faultline-protobuf = { path = "../crates/faultline-protobuf" }
faultline-graphql = { path = "../crates/faultline-graphql" }
faultline-avro = { path = "../crates/faultline-avro" }
faultline-wsdl = { path = "../crates/faultline-wsdl" }
faultline-raml = { path = "../crates/faultline-raml" }
faultline-xml = { path = "../crates/faultline-xml" }
faultline-xsd = { path = "../crates/faultline-xsd" }
faultline-asyncapi = { path = "../crates/faultline-asyncapi" }
faultline-regex = { path = "../crates/faultline-regex" }
faultline-registry = { path = "../crates/faultline-registry" }
faultline-diff = { path = "../crates/faultline-diff" }

# Kept out of the main workspace: fuzz targets need a nightly toolchain and
# sanitizer flags that must not leak into regular builds.
[workspace]
members = ["."]

[[bin]]
name = "parse_json"
path = "fuzz_targets/parse_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_yaml"
path = "fuzz_targets/parse_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "uri_pointer"
path = "fuzz_targets/uri_pointer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lower_jsonschema"
path = "fuzz_targets/lower_jsonschema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lower_openapi"
path = "fuzz_targets/lower_openapi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lower_protobuf"
path = "fuzz_targets/lower_protobuf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lower_graphql"
path = "fuzz_targets/lower_graphql.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lower_avro"
path = "fuzz_targets/lower_avro.rs"
test = false
doc = false
bench = false

[[bin]]
name = "regex"
path = "fuzz_targets/regex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_request"
path = "fuzz_targets/http_request.rs"
