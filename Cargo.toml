[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Fredrik Ahman <fredrik.fullstackdev@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/integral0909/faultline"
homepage = "https://github.com/integral0909/faultline"
keywords = ["api", "schema", "compatibility", "openapi", "protobuf"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
faultline-source = { path = "crates/faultline-source", version = "0.1.0" }
faultline-doc = { path = "crates/faultline-doc", version = "0.1.0" }
faultline-ir = { path = "crates/faultline-ir", version = "0.1.0" }

indexmap = "2.7"
proptest = "1"
saphyr-parser = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight idiomatic code more than they help.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
# Offsets are u32 by design (see faultline-source); conversions are checked at the boundary.
cast_possible_truncation = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
debug = true
