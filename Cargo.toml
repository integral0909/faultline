[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Fredrik Ahman <fredrik.fullstackdev@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/integral0909/faultline"
homepage = "https://github.com/integral0909/faultline"
keywords = ["api", "schema", "compatibility", "openapi", "protobuf"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
faultline = { path = "crates/faultline", version = "0.1.0" }
faultline-source = { path = "crates/faultline-source", version = "0.1.0" }
faultline-doc = { path = "crates/faultline-doc", version = "0.1.0" }
faultline-avro = { path = "crates/faultline-avro", version = "0.1.0" }
faultline-diff = { path = "crates/faultline-diff", version = "0.1.0" }
faultline-graphql = { path = "crates/faultline-graphql", version = "0.1.0" }
faultline-ir = { path = "crates/faultline-ir", version = "0.1.0" }
faultline-jsonschema = { path = "crates/faultline-jsonschema", version = "0.1.0" }
faultline-lsp = { path = "crates/faultline-lsp", version = "0.1.0" }
faultline-net = { path = "crates/faultline-net", version = "0.1.0" }
faultline-openapi = { path = "crates/faultline-openapi", version = "0.1.0" }
faultline-policy = { path = "crates/faultline-policy", version = "0.1.0" }
faultline-protobuf = { path = "crates/faultline-protobuf", version = "0.1.0" }
faultline-registry = { path = "crates/faultline-registry", version = "0.1.0" }
faultline-regex = { path = "crates/faultline-regex", version = "0.1.0" }
faultline-report = { path = "crates/faultline-report", version = "0.1.0" }
faultline-rules = { path = "crates/faultline-rules", version = "0.1.0" }
faultline-subsume = { path = "crates/faultline-subsume", version = "0.1.0" }
faultline-usage = { path = "crates/faultline-usage", version = "0.1.0" }
faultline-vcs = { path = "crates/faultline-vcs", version = "0.1.0" }

clap = { version = "4.5", features = ["derive"] }
gix = { version = "0.88", default-features = false, features = ["parallel", "revision", "sha1"] }
indexmap = "2.7"
jsonschema = { version = "0.58", default-features = false, features = ["arbitrary-precision"] }
proptest = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
tempfile = "3"
toml = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
saphyr-parser = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight idiomatic code more than they help.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
# Two-sided comparisons read best with short symmetric names (l/r, a/b).
many_single_char_names = "allow"
# Offsets are u32 by design (see faultline-source); conversions are checked at the boundary.
cast_possible_truncation = "allow"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
debug = true
