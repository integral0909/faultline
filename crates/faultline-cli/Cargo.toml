# too would collide with it.
doc = false

[dependencies]
clap.workspace = true
clap_complete.workspace = true
faultline.workspace = true
faultline-ir.workspace = true
faultline-lsp.workspace = true
faultline-policy.workspace = true
faultline-registry.workspace = true
faultline-report.workspace = true
faultline-rules.workspace = true
faultline-source.workspace = true
faultline-usage.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
